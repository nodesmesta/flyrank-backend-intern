services:
  db:
    image: postgres:17-alpine
    container_name: be04-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: be04
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d be04"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: be04-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://app:secret@db:5432/be04
      PORT: "3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
